# Local/CI-only config for the Supabase CLI. Not used in production - the
# real project is configured through the Supabase dashboard. This file
# exists so `supabase start` can spin up a throwaway local stack and apply
# every file in supabase/migrations/ in order, catching a broken migration
# in CI before it ever reaches the real project. See
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "haimunia-app-demo"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Keep in sync with the real project's Postgres major version
# (`show server_version;` on the real project) if migrations ever start
# depending on version-specific behavior.
major_version = 17

[db.migrations]
enabled = true

[db.seed]
# No seed data - the migrations themselves are what this check verifies.
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Required - see COMMUNITY_SETUP.md's "Sign-in has no email" section. Every
# real signup starts as an anonymous session before becoming permanent.
enable_anonymous_sign_ins = true
enable_manual_linking = false
# Launch-readiness audit, SEC-012. Was 6 / "" (no complexity requirement) on
# an account whose identifier is a guessable username
# (usernameToEmail() -> `${username}@members.haimuniya.invalid`, and handles
# are club-public via the member directory) - credential stuffing and online
# guessing against a known username list was the realistic attack, with only
# Supabase's platform-level auth throttling in the way. This file is
# local/CI-only (see the header above); the real project's dashboard
# Authentication settings must be changed to match by hand - this migration
# cannot reach them.
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = true
# Matches the real project's "Confirm email OFF" setting - see
# COMMUNITY_SETUP.md step 3. No inbox ever exists behind the synthetic
# @members.haimuniya.invalid addresses this app generates.
enable_confirmations = false
secure_password_change = false

[auth.sms]
enable_signup = false

[edge_runtime]
# The Edge Functions in this repo
# (supabase/functions/). Turning this on is what makes
# `supabase start`/`supabase functions serve` actually boot the Deno
# runtime container locally; it changes nothing about the real project,
# which is configured through the dashboard (see the file header).
enabled = true
# "oneshot" reloads the function on every request, which is what you want
# while iterating locally - "per_worker" is the production-like mode.
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false
