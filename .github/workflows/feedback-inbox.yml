# feedback-inbox: print the unread in-app feedback so a Claude session (or you) can read and summarise it.
#
# MANUAL ONLY. Reads public.bug_reports through the Supabase Management API with the same
# SUPABASE_ACCESS_TOKEN secret the other ops workflows use; nothing new to configure.
# What is printed: the message text, status, tag, app version and time. Never the reporter's id,
# username or device facts. Inputs:
#   mark_read  false (default) only reads; true also sets read_at on exactly the rows printed.
#   limit      how many, oldest first (1 to 100, default 50).
# The rows are printed between FEEDBACK-BEGIN and FEEDBACK-END as JSON, and to the job summary.
name: feedback-inbox
on:
  workflow_dispatch:
    inputs:
      mark_read:
        description: "Mark the printed reports as read"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      limit:
        description: "How many reports (1 to 100)"
        required: false
        default: "50"
permissions:
  contents: read
concurrency:
  group: feedback-inbox
  cancel-in-progress: false
jobs:
  inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      MARK_READ: ${{ inputs.mark_read }}
      LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: refuse to run without the access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set. Nothing was read."
            exit 1
          fi

      - name: read the unread feedback
        run: |
          set +x
          node scripts/feedback-inbox.mjs
