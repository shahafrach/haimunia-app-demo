name: backup-database
# WHY THIS EXISTS.
#
# The Supabase free tier takes no automatic backups. Until now the only copy
# of this club's data outside the live project was whatever a member happened
# to export from the app, which covers one member's own training log and
# nothing else: no profiles, no invite redemptions, no posts, no challenges,
# no audit trail. A dropped table, a bad migration or a deleted project would
# have been unrecoverable, and nobody would have discovered that until they
# needed it.
#
# ---------------------------------------------------------------------------
# TWO REQUIRED SECRETS, in Settings -> Secrets and variables -> Actions:
#
#   SUPABASE_DB_URL    the direct Postgres connection string, from
#                      Dashboard -> Project Settings -> Database -> Connection
#                      string -> URI. It contains the database password, so
#                      it is a secret in the strongest sense: it reads and
#                      writes every member's data.
#
#   BACKUP_PASSPHRASE  a long random passphrase used to encrypt the dump
#                      before it leaves this job. Generate one and store it
#                      somewhere that is NOT this repo and NOT the same
#                      password manager entry as the database - a backup you
#                      cannot decrypt is not a backup, and one anybody can
#                      decrypt is a leak.
#
# THE ENCRYPTION IS NOT OPTIONAL, AND HERE IS WHY. This repository has been
# PRIVATE since 2026-09-17, and that changes the size of the audience, not the
# argument. A workflow artifact is readable by everyone who can read this
# repository and by anything holding a token with `actions: read` on it - every
# collaborator, every PAT one of them has issued, and every third-party action
# any workflow here runs. It sits in GitHub's storage for the 90 days set
# below, which outlives any later change to who has access or to whether this
# repository is private at all. An unencrypted dump would put every member's
# profile, handle, invite history and private training records behind nothing
# but that. So the job refuses to run at all without the passphrase, the
# plaintext dump never exists outside the runner, and only the ciphertext is
# uploaded.
#
# TO RESTORE:
#   gh run download <run-id> -n haimunia-db-backup
#   gpg --batch --passphrase "$BACKUP_PASSPHRASE" -d backup.tar.gz.gpg > b.tar.gz
#   tar -xzf b.tar.gz
#   psql "$TARGET_DB_URL" -f schema.sql        # or: supabase db push
#   # EMPTY IT FIRST. Migrations seed reference data - one clubs row, 20
#   # club_features, 31 achievement_definitions, 6 roles, 14 permissions - and
#   # the dump carries those same rows, so a straight load dies on a duplicate
#   # key. Truncate exactly what the dump restores, read out of the dump:
#   TARGETS=$(grep -oE 'INSERT INTO "[a-z_]+"\."[a-z_]+"' data.sql \
#             | sed 's/INSERT INTO //; s/"\([a-z_]*\)"\."\([a-z_]*\)"/\1.\2/' \
#             | sort -u | paste -sd, -)
#   psql "$TARGET_DB_URL" -c "begin; set session_replication_role = replica; \
#                             truncate table $TARGETS cascade; commit;"
#   # Do NOT truncate all of public and storage instead: storage.migrations and
#   # storage.buckets_vectors belong to supabase_storage_admin and refuse even
#   # postgres, and one permission error rolls the whole thing back.
#   psql "$TARGET_DB_URL" -v ON_ERROR_STOP=1 \
#                         -c "SET session_replication_role = replica;" \
#                         -f data.sql \
#                         -c "SET session_replication_role = DEFAULT;"
#
# THE session_replication_role LINE IS LOAD-BEARING, and it is not decoration.
# The first real run of this job (2026-09-17) printed:
#
#   pg_dump: warning: there are circular foreign-key constraints on this table:
#   pg_dump: detail: profiles
#   pg_dump: detail: post_comments
#
# Both are SELF-references - profiles.assigned_coach_id -> profiles.id, and
# post_comments.parent_comment_id -> post_comments.id - so a data-only dump can
# emit a row before the row it points at: a reply before its parent comment, a
# member before their assigned coach. The restore then fails on a foreign key
# for a reason that has nothing to do with the data being wrong.
#
# supabase db dump does not expose pg_dump's --disable-triggers, so this cannot
# be fixed on the dump side. session_replication_role = replica suspends
# trigger and FK enforcement for the session, which is the standard answer and
# costs nothing while the constraints are re-checked by nothing else in a
# restore. Do NOT leave it set.
#
# The schema half is also reconstructible from supabase/migrations/ alone, so
# the irreplaceable part of what this captures is the DATA.
#
# NOT YET DONE, and worth knowing: nothing has actually restored one of these.
# The job proves the ciphertext decrypts and that the dump is non-empty and
# contains the tables this app cannot work without, which is more than most
# backup jobs prove and still not the same as a rehearsed restore.
# ---------------------------------------------------------------------------
on:
  schedule:
    # 02:17 UTC, six days a week. Off the hour on purpose: every cron on the
    # hour contends with every other cron on the hour, and a backup that gets
    # queued behind the internet is a backup that sometimes does not run.
    - cron: "17 2 * * 1-6"
    # Sunday is the same backup PLUS the restore drill below. Weekly rather
    # than nightly at the owner's choice: Actions minutes are metered since
    # the repository went private, and a rehearsal that runs every seven days
    # still catches a backup that has stopped being restorable long before
    # anyone needs it.
    - cron: "17 2 * * 0"
  workflow_dispatch:
    inputs:
      drill:
        description: "Also rehearse the restore"
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: backup-database
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fails loudly rather than skipping quietly, the same rule
      # deploy-edge-functions.yml follows: a backup job that reports green
      # while backing nothing up is worse than no job at all, because it
      # converts "we have no backups" into "we think we have backups".
      - name: refuse to run without both secrets
        run: |
          missing=0
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL is not set."; missing=1
          fi
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "BACKUP_PASSPHRASE is not set. Refusing to produce a dump"
            echo "that could only be uploaded in the clear - this repository"
            echo "is private, but an artifact is still readable by everyone"
            echo "with access to it, for 90 days, and this one is every"
            echo "member's data."
            missing=1
          fi
          # Added 2026-09-23. The database half alone is NOT a backup of this
          # app: the 2026-09-23 restore drill established that `supabase db
          # dump` captures storage.objects ROWS and not the files, so a
          # database-only archive restores perfectly and leaves every member
          # photo pointing at bytes that no longer exist. Refusing is
          # deliberate, and follows this file's own rule: a backup job that
          # reports green while backing up half of the data is worse than no
          # job, because it converts "we have no photo backup" into "we think
          # we do".
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF is not set."
            echo "Both are needed to download the photo buckets. Without them"
            echo "this job would back up the database only, which the restore"
            echo "drill showed is not a recoverable backup of this app."
            missing=1
          fi
          exit $missing

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0

      # Schema and data separately, which is how they are restored: the
      # schema is reproducible from migrations, the data is not. Keeping them
      # apart means a data-only restore into a freshly migrated project
      # (the common case) does not have to fight a second copy of the DDL.
      - name: dump
        run: |
          set -euo pipefail
          mkdir -p backup
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/data.sql --data-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/roles.sql --role-only

      # THE OTHER HALF OF THE BACKUP (2026-09-23). Downloads every object in
      # post-photos and avatar-photos into backup/storage/, with a manifest
      # carrying a sha256 per file so a restore can be checked rather than
      # hoped at. Photos do not compress - measured at a ratio of 1.000 on
      # real JPEGs - so the archive grows by very close to the raw byte total.
      - name: photos and avatars
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          node scripts/backup-storage.mjs backup backup

      # A DUMP THAT SUCCEEDED IS NOT A DUMP THAT CONTAINS ANYTHING. pg_dump
      # exits 0 on an empty result, so size is checked before anything is
      # called a backup - the same class of false-green as the cron job that
      # POSTed to a 404 every night and recorded 'succeeded'.
      - name: verify the dump is not empty
        run: |
          set -euo pipefail
          ls -l backup/
          for f in backup/schema.sql backup/data.sql; do
            size=$(stat -c%s "$f")
            echo "$f: $size bytes"
            if [ "$size" -lt 1024 ]; then
              echo "$f is under 1 KB - that is not a backup of this database."
              exit 1
            fi
          done
          # The schema must contain the tables this app cannot work without.
          #
          # THE PATTERN IS A REGEX BECAUSE THE LITERAL WAS WRONG. The first
          # real run failed here on a perfectly good 900 KB dump: the check
          # looked for `CREATE TABLE public.profiles`, and supabase db dump
          # runs pg_dump with --quote-all-identifier, so the actual text is
          # `CREATE TABLE IF NOT EXISTS "public"."profiles"`. A check that
          # fails a valid backup is worse than no check - it teaches whoever
          # sees it that the job is flaky, and the next real failure gets
          # waved through.
          #
          # Optional quotes and optional IF NOT EXISTS, so a change in either
          # does not fail a good dump again. Verified against a real dump
          # before shipping this time, including that it still REJECTS a dump
          # of some other database.
          for t in profiles invite_redemptions workout_posts private_records; do
            grep -Eq "CREATE TABLE( IF NOT EXISTS)? \"?public\"?\.\"?${t}\"?" backup/schema.sql || {
              echo "schema.sql has no public.$t - the dump is not this project."
              exit 1
            }
          done

          # AND THE DATA HALF CARRIES ROWS, not just a valid file. schema.sql
          # is reproducible from supabase/migrations/; data.sql is the part
          # that cannot be rebuilt from anything, so "it is over 1 KB" is too
          # weak a claim to rest a backup on.
          grep -q 'INSERT INTO "public"."clubs"' backup/data.sql || {
            echo "data.sql has no rows for public.clubs - a club with no club row is not a backup."
            exit 1
          }
          echo "data.sql INSERT statements: $(grep -c 'INSERT INTO' backup/data.sql)"

      - name: encrypt
        run: |
          set -euo pipefail
          tar -czf backup.tar.gz -C backup .
          gpg --batch --yes --symmetric --cipher-algo AES256 \
              --passphrase "$BACKUP_PASSPHRASE" \
              -o backup.tar.gz.gpg backup.tar.gz
          # The plaintext never reaches the upload step. shred rather than rm
          # so it does not sit in the runner image's filesystem either.
          shred -u backup.tar.gz
          rm -rf backup
          ls -l backup.tar.gz.gpg
          sha256sum backup.tar.gz.gpg

      # Round-trips the ciphertext before calling the run a success. An
      # encrypted file nobody has ever decrypted is a guess, not a backup.
      # LIST ONCE, THEN GREP THE LIST. `tar -tzf ... | grep -q` looks obvious
      # and fails: grep -q exits the moment it matches, tar is still writing,
      # and SIGPIPE plus `set -o pipefail` turns that into a failed step. It is
      # SIZE DEPENDENT, which is the worst part - a three-entry archive of tiny
      # files survives, and this one, with a 900 KB schema in it, did not.
      # Reproduced both ways before fixing: exit 0 small, exit 141 large.
      - name: prove it decrypts
        run: |
          set -euo pipefail
          gpg --batch --yes --passphrase "$BACKUP_PASSPHRASE" \
              -d backup.tar.gz.gpg > /tmp/roundtrip.tar.gz
          tar -tzf /tmp/roundtrip.tar.gz > /tmp/roundtrip.list
          cat /tmp/roundtrip.list
          for want in ./schema.sql ./data.sql ./roles.sql; do
            grep -qxF "$want" /tmp/roundtrip.list || {
              echo "the decrypted archive has no $want"
              exit 1
            }
          done
          shred -u /tmp/roundtrip.tar.gz
          rm -f /tmp/roundtrip.list

      # v6.0.0 is the first upload-artifact release whose action.yml declares
      # `runs.using: node24`; v5 carried preliminary Node 24 support but still
      # ran on node20 by default, which is what the runner deprecation warning
      # is about. The inputs used below are unchanged from v4 - no input this
      # step passes was renamed or removed. Minimum runner 2.327.1, which
      # ubuntu-latest on GitHub-hosted runners satisfies; there are no
      # self-hosted runners here.
      #
      # v7.0.1 (2026-09-23), still node24. Its action.yml, read at the tag,
      # differs from v6.0.0's only by one ADDED input, `archive`, defaulting to
      # 'true' - so this step still uploads a zip, which is what the drill's
      # download below expects to extract.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: haimunia-db-backup
          path: backup.tar.gz.gpg
          # 90 days is the free-tier artifact ceiling and there is no reason
          # to keep less. Older runs age out on their own; this is a rolling
          # window, not an archive.
          retention-days: 90
          if-no-files-found: error

  # ==========================================================================
  # THE DRILL. A backup nobody has restored is a guess, and this file said so
  # in a comment for a day before there was anything behind it.
  #
  # It deliberately starts from the ARTIFACT, not from the files still sitting
  # on the backup job's runner: download, decrypt, restore. That is the path a
  # real recovery takes, and each of those steps is a place it can be broken
  # without anyone noticing - a passphrase that does not round-trip, an
  # artifact that uploaded empty, a tar that unpacks to nothing.
  #
  # The restore target is `supabase start`, not a bare postgres image. That is
  # the honest shape of a recovery here: the SCHEMA comes back from
  # supabase/migrations/ (which is why migration-check exists), and the DATA
  # comes from the backup. A vanilla postgres container has no auth schema, no
  # extensions and none of this project's roles, so restoring into one would
  # test nothing and fail for reasons that have no bearing on the backup.
  #
  # And it is the only thing that actually exercises session_replication_role.
  # profiles.assigned_coach_id and post_comments.parent_comment_id are
  # self-referencing foreign keys, so a data-only dump can emit a child before
  # its parent; the restore instructions at the top of this file suspend
  # enforcement for exactly that reason, and until this job existed nobody had
  # ever run them.
  restore-drill:
    needs: backup
    # THE STRING FORM, because the typed one silently did not resolve.
    #
    # `inputs.drill` is documented as a real boolean for a workflow_dispatch
    # input of type: boolean, and on run #5 it evaluated to nothing: the
    # condition came out false, this job skipped, and the run went green with a
    # single job in it. A skipped job does not fail anything - which makes a
    # wrong `if` the quietest bug available, and the fourth thing today that
    # looked like protection and was not.
    #
    # github.event.inputs.drill is the raw payload value, the string "true" or
    # "false". It is uglier and it works. On a scheduled run there are no
    # inputs at all, so that half is simply null and the schedule check decides.
    if: >-
      github.event.schedule == '17 2 * * 0' ||
      github.event.inputs.drill == 'true' 
    runs-on: ubuntu-latest
    env:
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0
      # Says out loud that it is running, and why. The failure mode this job
      # just had was invisible precisely because nothing announced itself.
      - name: say what triggered this drill
        run: |
          echo "event:    ${{ github.event_name }}"
          echo "schedule: ${{ github.event.schedule }}"
          echo "drill in: ${{ github.event.inputs.drill }}"
          echo "This is the restore rehearsal. If you are reading this, it ran."

      # v7.0.0 for the same reason, one major later than upload's:
      # download-artifact v6 was the preliminary-Node-24 release and v7 is the
      # first that runs on it. v5's one behaviour change was to the
      # `artifact-ids` download path, which this step does not use - it
      # downloads by name, which has extracted to `path/` throughout.
      #
      # v8.0.1 (2026-09-23), still node24. v8 added two inputs and changed two
      # defaults, read from action.yml at the tag: `digest-mismatch` now
      # defaults to 'error' - wanted here, a drill should fail on a corrupt
      # artifact rather than restore it - and decompression is decided by the
      # blob's content-type, which for the zip upload-artifact makes by
      # default (`archive: true`, above) still extracts to `path/`.
      # `skip-decompress` defaults to 'false'.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: haimunia-db-backup

      - name: decrypt and unpack
        run: |
          set -euo pipefail
          gpg --batch --yes --passphrase "$BACKUP_PASSPHRASE" \
              -d backup.tar.gz.gpg > restore.tar.gz
          tar -xzf restore.tar.gz
          ls -l schema.sql data.sql roles.sql
          echo "rows to restore: $(grep -c 'INSERT INTO' data.sql)"

      # A real schema, built the way a real recovery would build it.
      - name: bring up a database with the schema from migrations
        run: supabase start

      # THE TARGET HAS TO BE EMPTY FIRST, and the runbook did not say so.
      #
      # Found by this drill on its first rehearsal, which is the whole argument
      # for having one. `supabase start` applies every migration, and those
      # migrations SEED reference data - one clubs row, 20 club_features, 31
      # achievement_definitions, 6 roles, 14 permissions, 55 grants. The dump
      # contains those same rows, so loading it straight in dies on a duplicate
      # key. A real recovery into a freshly migrated project hits exactly the
      # same wall: this was a flaw in the procedure, not in the drill.
      #
      # TRUNCATE EXACTLY WHAT IS ABOUT TO BE RESTORED, derived from the dump
      # itself rather than from a list someone has to maintain. Two earlier
      # attempts failed the other way round - "truncate everything in public
      # and storage" hit storage.migrations and then storage.buckets_vectors,
      # both owned by supabase_storage_admin and not truncatable even as
      # postgres, and one permission error rolls the whole transaction back so
      # NOTHING gets emptied and the restore fails anyway. Enumerating what
      # cannot be touched is a list that rots; enumerating what the dump
      # actually writes cannot.
      - name: empty exactly the tables the dump will restore
        run: |
          set -euo pipefail
          DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          TARGETS=$(grep -oE 'INSERT INTO "[a-z_]+"\."[a-z_]+"' data.sql \
                    | sed 's/INSERT INTO //; s/"\([a-z_]*\)"\."\([a-z_]*\)"/\1.\2/' \
                    | sort -u | paste -sd, -)
          if [ -z "$TARGETS" ]; then
            echo "data.sql names no tables at all - that is not a backup."
            exit 1
          fi
          echo "emptying: $TARGETS"
          psql "$DB" -v ON_ERROR_STOP=1 \
            -c "begin; set session_replication_role = replica; truncate table $TARGETS cascade; commit;"

      - name: restore the data, exactly as the runbook says to
        run: |
          set -euo pipefail
          DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          # session_replication_role = replica suspends FK and trigger
          # enforcement for the session. Without it a self-referencing row can
          # arrive before its parent and the whole restore aborts.
          # -v ON_ERROR_STOP=1 is what makes this a test rather than a log:
          # psql otherwise continues past a failed statement and exits 0, which
          # is how a restore "succeeds" while dropping half the rows.
          psql "$DB" -v ON_ERROR_STOP=1 \
            -c "SET session_replication_role = replica;" \
            -f data.sql \
            -c "SET session_replication_role = DEFAULT;"

      # THE ASSERTION THAT MAKES THIS A DRILL. Restoring without an error is
      # not the same as restoring the data: an empty data.sql would also load
      # without an error.
      - name: prove the rows are actually there
        run: |
          set -euo pipefail
          DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          fail=0
          for t in clubs profiles invite_redemptions; do
            n=$(psql "$DB" -tAc "select count(*) from public.$t")
            echo "  public.$t: $n rows"
            if [ "$n" -lt 1 ]; then
              echo "  public.$t came back EMPTY - the backup restored nothing for it."
              fail=1
            fi
          done
          # The self-referencing constraints must be satisfiable again once
          # enforcement is back on. This is the half that would silently rot:
          # session_replication_role lets the data IN regardless, so a restore
          # can succeed and still leave a profile pointing at a coach that
          # never arrived. A plain query, not a plpgsql block - dollar quoting
          # inside a YAML block inside a double-quoted shell string is three
          # layers of escaping and I got it wrong the first time.
          orphans=$(psql "$DB" -tAc "
            select count(*) from public.profiles p
             where p.assigned_coach_id is not null
               and not exists (select 1 from public.profiles c where c.id = p.assigned_coach_id)")
          echo "  profiles pointing at a coach that did not restore: $orphans"
          [ "$orphans" = "0" ] || fail=1

          orphan_replies=$(psql "$DB" -tAc "
            select count(*) from public.post_comments pc
             where pc.parent_comment_id is not null
               and not exists (select 1 from public.post_comments p where p.id = pc.parent_comment_id)")
          echo "  replies whose parent comment did not restore: $orphan_replies"
          [ "$orphan_replies" = "0" ] || fail=1

          exit $fail
