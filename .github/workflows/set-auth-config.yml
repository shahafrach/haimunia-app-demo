# Sets the two Supabase Auth settings BOX-LOG's sign-up depends on, on the
# project named in supabase/PROJECT_REF, through the Management API.
#
# WHY. A new Supabase project starts with anonymous sign-ins OFF and email
# confirmation ON. BOX-LOG's sign-up begins with an anonymous session, redeems
# an invite, then upgrades to a username and password mapped to a synthetic
# <name>@members.haimuniya.invalid address that can never receive mail
# (docs/circles/decisions.md: anonymous sign-ins stay on, no email, no SMTP).
# With the defaults, sign-in fails at the first step ("can't connect") and an
# upgrade would wait forever for a confirmation email. Found on 2026-10-29, the
# first real sign-up on the box-log project.
#
# So this sets, and nothing else:
#   external_anonymous_users_enabled = true
#   mailer_autoconfirm               = true   ("Confirm email" off)
# then reads both back and fails unless both are true. Idempotent: run it again
# on any new project. CAPTCHA stays as the owner set it in the dashboard.
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: set-auth-config
  cancel-in-progress: false
jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: refuse to run without the access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set. Nothing was changed."
            exit 1
          fi

      - name: set the two auth settings and verify them
        run: |
          set +x
          PROJECT_REF="$(tr -d '[:space:]' < supabase/PROJECT_REF)"
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X PATCH "$API" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"external_anonymous_users_enabled":true,"mailer_autoconfirm":true}')
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "PATCH $API answered HTTP $code. Nothing is known to have changed."
            exit 1
          fi
          state=$(curl -sS "$API" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const c=JSON.parse(s);process.stdout.write(JSON.stringify({anonymous_sign_ins:c.external_anonymous_users_enabled===true,confirm_email_off:c.mailer_autoconfirm===true}))})')
          {
            echo "## Auth config"
            echo
            echo "Project: \`$PROJECT_REF\`"
            echo
            echo '```'
            echo "$state"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$state"
          [ "$state" = '{"anonymous_sign_ins":true,"confirm_email_off":true}' ]
