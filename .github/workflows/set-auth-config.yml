# Sets the two Supabase Auth settings BOX-LOG's sign-up depends on, on the
# project named in supabase/PROJECT_REF, through the Management API.
#
# WHY. A new Supabase project starts with anonymous sign-ins OFF and email
# confirmation ON. BOX-LOG's sign-up begins with an anonymous session, redeems
# an invite, then upgrades to a username and password mapped to a synthetic
# <name>@members.haimuniya.invalid address that can never receive mail
# (docs/circles/decisions.md: anonymous sign-ins stay on, no email, no SMTP).
# With the defaults, sign-in fails at the first step ("can't connect") and an
# upgrade would wait forever for a confirmation email. Found on 2026-10-29, the
# first real sign-up on the box-log project.
#
# So this sets, and nothing else:
#   external_anonymous_users_enabled = true
#   mailer_autoconfirm               = true   ("Confirm email" off)
# then reads both back and fails unless both are true. A second step turns on
# passkeys for the club app (Q-38c/e: rp_id haimunia.pages.dev) and reads them back. Idempotent: run it again
# on any new project. CAPTCHA stays as the owner set it in the dashboard: this never writes it,
# but (Q-50, PRR 2026-11-19) the last step reads it back and FAILS when CAPTCHA (Turnstile) is
# off or the anonymous sign-in limit is unset, and prints both to the job summary. Anonymous
# sign-ins are on for everyone, so those two are what stand between the sign-up and a script.
# The run name carries anon_limit so auth-launch-limit.yml can find the launch-week
# raise (the Actions API does not return a run's inputs).
run-name: set-auth-config anon_limit=${{ inputs.anon_limit }}
on:
  workflow_dispatch:
    inputs:
      anon_limit:
        description: "Anonymous sign-ins per hour per IP (empty: leave it). 300 for the club's launch week; auth-launch-limit.yml lowers it to 60 after seven days."
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: set-auth-config
  cancel-in-progress: false
jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: refuse to run without the access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set. Nothing was changed."
            exit 1
          fi

      - name: set the two auth settings and verify them
        run: |
          set +x
          PROJECT_REF="$(tr -d '[:space:]' < supabase/PROJECT_REF)"
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X PATCH "$API" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"external_anonymous_users_enabled":true,"mailer_autoconfirm":true,"mfa_totp_enroll_enabled":true,"mfa_totp_verify_enabled":true,"password_min_length":10,"password_required_characters":""}')
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "PATCH $API answered HTTP $code. Nothing is known to have changed."
            exit 1
          fi
          state=$(curl -sS "$API" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const c=JSON.parse(s);process.stdout.write(JSON.stringify({anonymous_sign_ins:c.external_anonymous_users_enabled===true,confirm_email_off:c.mailer_autoconfirm===true,totp_enroll:c.mfa_totp_enroll_enabled===true,totp_verify:c.mfa_totp_verify_enabled===true,password_rule:c.password_min_length===10&&!c.password_required_characters}))})')
          {
            echo "## Auth config"
            echo
            echo "Project: \`$PROJECT_REF\`"
            echo
            echo '```'
            echo "$state"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$state"
          [ "$state" = '{"anonymous_sign_ins":true,"confirm_email_off":true,"totp_enroll":true,"totp_verify":true,"password_rule":true}' ]
      # Q-38c/e (2026-11-18): sign-in with Face ID / Touch ID in the club app, Supabase's native passkeys
      # (experimental; docs/circles/decisions.md). The relying party is the club app's own host: a passkey is
      # bound to it for good, so it never changes. BOX-LOG and the old app are other hosts and have none.
      - name: turn on passkeys for the club app and verify
        run: |
          set +x
          PROJECT_REF="$(tr -d '[:space:]' < supabase/PROJECT_REF)"
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X PATCH "$API" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-raw '{"passkey_enabled":true,"webauthn_rp_id":"haimunia.pages.dev","webauthn_rp_display_name":"האימוניה","webauthn_rp_origins":"https://haimunia.pages.dev"}')
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "PATCH $API answered HTTP $code. Passkeys are not known to be on."
            exit 1
          fi
          pk=$(curl -sS "$API" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const c=JSON.parse(s);process.stdout.write(JSON.stringify({passkeys:c.passkey_enabled===true,rp_id:c.webauthn_rp_id,rp_origins:c.webauthn_rp_origins}))})')
          echo "$pk" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$pk" = '{"passkeys":true,"rp_id":"haimunia.pages.dev","rp_origins":"https://haimunia.pages.dev"}' ]
      - name: set the anonymous sign-in limit, if asked, and verify it
        if: ${{ inputs.anon_limit != '' }}
        env:
          ANON_LIMIT: ${{ inputs.anon_limit }}
        run: |
          set +x
          case "$ANON_LIMIT" in ''|*[!0-9]*) echo "anon_limit must be a whole number."; exit 1 ;; esac
          if [ "$ANON_LIMIT" -lt 1 ] || [ "$ANON_LIMIT" -gt 1000 ]; then echo "anon_limit must be 1 to 1000."; exit 1; fi
          PROJECT_REF="$(tr -d '[:space:]' < supabase/PROJECT_REF)"
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X PATCH "$API" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-raw "{\"rate_limit_anonymous_users\":$ANON_LIMIT}")
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "PATCH $API answered HTTP $code. The limit is not known to have changed."
            exit 1
          fi
          now=$(curl -sS "$API" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(String(JSON.parse(s).rate_limit_anonymous_users)))')
          echo "anonymous sign-ins per hour: $now" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$now" = "$ANON_LIMIT" ]
      # Q-50 (Grok backend PRR, 2026-11-19): anonymous sign-ins are on, so CAPTCHA and the per-IP limit
      # are the only brakes on scripted sign-ups. Neither is written here (the owner sets CAPTCHA and its
      # secret in the dashboard); both are read back and the run fails when either is missing. Last step,
      # so a limit the step above just set is the one checked. Only these three fields leave the API answer:
      # never the CAPTCHA secret.
      - name: verify CAPTCHA (Turnstile) is on and the anonymous sign-in limit is set
        run: |
          set +x
          PROJECT_REF="$(tr -d '[:space:]' < supabase/PROJECT_REF)"
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth"
          guard=$(curl -sS "$API" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const c=JSON.parse(s);const n=c.rate_limit_anonymous_users;process.stdout.write(JSON.stringify({captcha:c.security_captcha_enabled===true,captcha_provider:c.security_captcha_provider??null,anon_limit:Number.isInteger(n)&&n>0?n:null}))})')
          {
            echo
            echo "### Abuse guards (read only)"
            echo
            echo '```'
            echo "$guard"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$guard"
          echo "$guard" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const g=JSON.parse(s);const bad=[];if(!g.captcha)bad.push("CAPTCHA is off: turn on Turnstile in Authentication -> Attack Protection");else if(g.captcha_provider!=="turnstile")bad.push("CAPTCHA provider is "+g.captcha_provider+", not turnstile (the club app only renders Turnstile)");if(g.anon_limit===null)bad.push("the anonymous sign-in limit is unset: run this workflow with anon_limit (60, or 300 in launch week)");for(const b of bad)console.log("::error::"+b);process.exit(bad.length?1:0)})'
