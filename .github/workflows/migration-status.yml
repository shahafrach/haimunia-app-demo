name: migration-status
# Read-only. After a merge to main that touches supabase/migrations/, waits for
# the Supabase GitHub integration to apply the new migration, then checks that
# every repository migration is applied on the live project and that the
# project has none the repository lacks (scripts/migration-status.mjs).
#
# Green: the integration did its job. Red with PENDING: it did not; the merging
# session dispatches apply-migrations.yml (confirm = apply), which is the
# manual fallback (docs/ops/MIGRATIONS.md). This workflow changes nothing.
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:
    inputs:
      wait_minutes:
        description: "Minutes to wait before checking"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: migration-status
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # A push waits 10 minutes for the integration; a manual run checks at once unless told otherwise.
      WAIT_MINUTES: ${{ github.event_name == 'push' && '10' || inputs.wait_minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: refuse to run without the access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set. Nothing was read."
            exit 1
          fi
      - name: wait for the integration
        run: |
          case "$WAIT_MINUTES" in ''|*[!0-9]*) WAIT_MINUTES=0 ;; esac
          [ "$WAIT_MINUTES" -gt 15 ] && WAIT_MINUTES=15
          echo "waiting $WAIT_MINUTES minute(s)"
          sleep $(( WAIT_MINUTES * 60 ))
      - name: compare the repository with the live project
        run: |
          set +x
          node scripts/migration-status.mjs
