name: rotate-recovery-secret
# Creates the HMAC key behind password recovery codes, without any person or
# session seeing it. RUN IT ONCE, before the first member makes a recovery code.
#
# What it does, in order:
#   1. refuses to run without SUPABASE_ACCESS_TOKEN, and refuses to REPLACE a key
#      that already exists unless `replace` is set to true: every recovery code
#      is an HMAC under this key, so a new key makes every code in the database
#      useless (members would have to make new ones; a lost-password friend
#      would need an owner reset code);
#   2. generates 32 random bytes ON THE RUNNER and writes RECOVERY_CODE_HMAC_SECRET
#      to a 0600 file in the runner's temp dir;
#   3. sets it as a Supabase Edge Function secret with `supabase secrets set
#      --env-file` (never on a command line, never echoed; the CLI's own output
#      is discarded), against the project in supabase/PROJECT_REF, with the
#      existing SUPABASE_ACCESS_TOKEN secret;
#   4. writes only a confirmation to the job summary, and deletes the file, even
#      when a step failed.
# issue-recovery-code and recover-password read the secret at run time, so
# nothing needs redeploying (deploy-edge-functions deploys the functions).
#
# Needs one repository secret, which the deploy workflows already use:
#   SUPABASE_ACCESS_TOKEN - a Supabase personal access token.
# Never add a step here that prints, uploads, caches or summarises the secret or
# the env file; test/rotate-recovery-secret-workflow.test.mjs fails if one appears.
on:
  workflow_dispatch:
    inputs:
      replace:
        description: "Replace an existing key (invalidates every recovery code). Leave false."
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: rotate-recovery-secret
  cancel-in-progress: false
jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REPLACE: ${{ inputs.replace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: refuse to run without the access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set. No key was generated and nothing was changed."
            exit 1
          fi

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.116.0

      - name: refuse to replace an existing key unless asked
        run: |
          set +x
          PROJECT_REF="$(tr -d '[:space:]' < supabase/PROJECT_REF)"
          if supabase secrets list --project-ref "$PROJECT_REF" 2>/dev/null | grep -q 'RECOVERY_CODE_HMAC_SECRET'; then
            if [ "$REPLACE" != "true" ]; then
              echo "RECOVERY_CODE_HMAC_SECRET already exists. Nothing was changed."
              echo "Replacing it makes every existing recovery code useless; run again with replace=true only if that is what you want."
              exit 1
            fi
          fi

      - name: generate the key on the runner and set the Edge Function secret
        run: |
          set +x
          umask 077
          PROJECT_REF="$(tr -d '[:space:]' < supabase/PROJECT_REF)"
          ENV_FILE="$RUNNER_TEMP/recovery.env"
          # The value goes into $ENV_FILE and nowhere else.
          printf 'RECOVERY_CODE_HMAC_SECRET=%s\n' "$(openssl rand -hex 32)" > "$ENV_FILE"
          if ! supabase secrets set --env-file "$ENV_FILE" --project-ref "$PROJECT_REF" >/dev/null 2>&1; then
            echo "supabase secrets set failed. Its output is discarded on purpose, so it cannot carry the key."
            exit 1
          fi
          {
            echo "## Recovery-code key set"
            echo
            echo "Project: \`$PROJECT_REF\`"
            echo
            echo "The Edge Function secret \`RECOVERY_CODE_HMAC_SECRET\` was generated on the runner and never printed."
            echo "Next: make sure issue-recovery-code and recover-password are deployed (deploy-edge-functions)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: delete the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/recovery.env"
