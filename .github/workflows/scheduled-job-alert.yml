name: scheduled-job-alert
# Go-live guide, item A.5. Nothing pages a human when a pg_cron job stops
# running, so this workflow is that wiring - see
# scripts/check-scheduled-job-health.mjs for the check itself and the reasons
# behind its exit-code discipline (checked-and-healthy, checked-and-unhealthy,
# and could-not-check are three DIFFERENT outcomes, deliberately).
#
# NO SERVICE-ROLE KEY. THAT IS THE POINT OF THIS FILE.
#
# This workflow used to carry SUPABASE_SERVICE_ROLE_KEY, because the only way
# to ask "are the scheduled jobs healthy" was public.scheduled_job_health(),
# which is service_role only by design - it returns every job's name, schedule
# and last error. So a credential that bypasses every RLS policy on real
# members' posts, profiles and training logs lived in GitHub Actions in order
# to answer a yes/no question. The old version of this file called that an
# accepted tradeoff and wrote down the shape of the fix; migration
# 202609190001 is that fix.
#
# The check now runs INSIDE the database, hourly, as the pg_cron job
# 'job-health-check'. It is what reads cron.job_run_details, and on a problem
# it notifies the club's admins in-app through the ordinary notifications
# path. This workflow reads only its verdict, via public.job_health_status():
#
#     ok              boolean      - is every scheduled job healthy
#     failing_count   integer      - how many are not
#     last_checked_at timestamptz  - when that in-database check last ran
#
# No job names, no schedules, no error text, no member data. So it runs with
# the PUBLISHABLE key already committed in cloud-config.js and already served
# to every browser - the same key, and the same argument, as the
# edge-functions-deployed job in test.yml. There is no Supabase secret in this
# path at all, which also means it works unchanged on a fork.
#
# THE JOB FAILS WHEN ok IS FALSE, **OR** WHEN last_checked_at IS OLDER THAN
# TWO HOURS. The second half matters more than the first: `ok` is a stored
# opinion, and if the hourly in-database check has died, a frozen `ok: true`
# reads exactly like a healthy backend. That is the same silent-failure shape
# as purge_due_accounts(), which sat unscheduled for the life of the project
# because a job that does not run emits nothing at all. Two hours tolerates
# exactly one missed hourly run and not two.
#
# One optional repository secret (Settings -> Secrets and variables ->
# Actions), and it is the only secret left here:
#   ALERT_WEBHOOK_URL - a Slack or Discord incoming webhook URL (or anything
#                       else that accepts {"text": "..."}). With it unset,
#                       this workflow's own red run IS the alert and the
#                       message is printed to the log instead - it fails
#                       closed, not silently.
#
# Two operational notes for whoever maintains this:
#   - GitHub disables scheduled workflows after 60 days with no repository
#     activity. On a quiet repo, this alert's own silence would be silent -
#     check the Actions tab occasionally, don't rely solely on "no email
#     means fine."
#   - A `schedule` trigger only fires from the DEFAULT branch. This is not
#     live until it's on `main` - a file existing on a feature branch does
#     not satisfy go-live item A.5.
on:
  schedule:
    # Every six hours, on the hour. This was once a day while it cost a
    # service-role key to run; it costs nothing now, and the in-database check
    # it watches runs hourly, so a daily backstop would have left "the
    # monitor itself is dead" undetected for up to 23 hours while the
    # script's own staleness budget is two. Four runs a day bounds that at
    # six. Members are not affected by this cadence either way - a real job
    # failure reaches the admins in-app within the hour, from the database.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: check job_health_status() and alert if unhealthy or stale
        env:
          # No SUPABASE_* secret. The URL and the publishable key are read
          # from cloud-config.js, which is committed and public by design.
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: node scripts/check-scheduled-job-health.mjs
