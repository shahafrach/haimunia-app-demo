name: auth-launch-limit
# Owner decision 6 (docs/club/research.md, finding 1): anonymous sign-ins are
# raised to 300 an hour for the club's launch week through set-auth-config.yml,
# then lowered to 60. This runs daily and lowers the limit on its own once the
# raise is seven days old (scripts/auth-launch-limit.mjs). Below or at 60 it
# changes nothing.
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: set-auth-config
  cancel-in-progress: false

jobs:
  lower:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: refuse to run without the access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set. Nothing was changed."
            exit 1
          fi
      - name: lower the limit once launch week is over
        run: |
          set +x
          node scripts/auth-launch-limit.mjs
