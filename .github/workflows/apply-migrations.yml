# apply-migrations: the same gate as `npm run push:prod`, run on GitHub, for when nobody has the CLI link locally.
#
# MANUAL ONLY, and it applies SQL to PRODUCTION. It refuses unless:
#   * it was started on main (production only ever receives migrations exactly as merged);
#   * the confirm input is the word "apply" (the typed confirmation push:prod asks for);
#   * SUPABASE_ACCESS_TOKEN is set (the same secret the other ops workflows use; `supabase link` with it needs no DB password);
#   * check:versions and check:immutable pass (no shared version prefix, no applied migration edited);
#   * production holds no migration that is missing from the repo (someone ran SQL by hand: work out what it did
#     first). Pending migrations are expected and are what gets applied (same rule as push:prod).
# Then it prints what is pending, runs `supabase db push --linked --yes` and prints the migration list again.
# Take a backup first (Actions, backup-database): there is no undo for a migration.
name: apply-migrations
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type the word "apply" to change the PRODUCTION database'
        required: true
        default: ""
        type: string
permissions:
  contents: read
concurrency:
  group: apply-migrations
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      CONFIRM: ${{ inputs.confirm }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: refuse unless on main, confirmed and able to connect
        run: |
          if [ "$REF_NAME" != "main" ]; then echo "::error::Run this on main (it was started on $REF_NAME). Nothing was changed."; exit 1; fi
          if [ "$CONFIRM" != "apply" ]; then echo "::error::confirm must be the word apply. Nothing was changed."; exit 1; fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::SUPABASE_ACCESS_TOKEN is not set. Nothing was changed."; exit 1; fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.116.0

      - name: link the project named in supabase/PROJECT_REF
        run: |
          set -euo pipefail
          supabase link --project-ref "$(tr -d '[:space:]' < supabase/PROJECT_REF)"

      - name: gates (versions, immutability, drift)
        run: |
          set -euo pipefail
          npm run check:versions
          npm run check:immutable
          # Same rule as scripts/push-migrations.mjs: migrations committed but not yet applied are what this run is
          # FOR. It refuses only when production could not be read (exit 2) or holds migrations the repo does not
          # (somebody ran SQL by hand: work out what it did first).
          set +e
          out="$(node scripts/check-migration-drift.mjs 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 2 ] || echo "$out" | grep -q "applied to production but NOT in the repo"; then
            echo "::error::Refusing: production could not be read, or it has migrations the repository does not. Nothing was changed."
            exit 1
          fi

      - name: pending migrations
        run: |
          set -euo pipefail
          supabase migration list --linked

      - name: apply
        run: |
          set -euo pipefail
          supabase db push --linked --yes

      - name: result
        run: |
          set -euo pipefail
          supabase migration list --linked
          npm run check:drift
