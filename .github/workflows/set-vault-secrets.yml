name: set-vault-secrets
# Writes the two Vault secrets the scheduled Edge Function jobs read, without
# any person or session seeing the service_role key:
#   edge_functions_base_url          https://<ref>.supabase.co/functions/v1
#   edge_functions_service_role_key  the project's service_role key
# Until both are set, public.cron_invoke_edge_function() skips every Edge
# Function cron job (week card push, purge-abandoned-profiles, recap) with a
# NOTICE.
#
# What it does, in order:
#   1. reads the project ref from supabase/PROJECT_REF and refuses to run
#      without SUPABASE_ACCESS_TOKEN;
#   2. scripts/set-vault-secrets.mjs fetches the service_role key from the
#      Management API into memory, masks it (::add-mask::) before any use, and
#      writes both secrets with vault.update_secret through the database query
#      endpoint (JSON body only; every response body is discarded);
#   3. verifies WITHOUT revealing: Postgres says whether each secret exists and
#      is no longer its placeholder, and only those two booleans reach the job
#      summary.
# When to run it: once after a project is created, and again after the
# service_role key is rotated. See docs/ops/VAULT_SECRETS.md.
#
# Needs one repository secret, which the deploy workflows already use:
#   SUPABASE_ACCESS_TOKEN - a Supabase personal access token.
# Never add a step here that prints, uploads, caches or summarises the key;
# test/set-vault-secrets-workflow.test.mjs fails if one appears.
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: set-vault-secrets
  cancel-in-progress: false
jobs:
  set:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: refuse to run without the access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set. Nothing was changed."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: write the Vault secrets and verify them
        run: |
          set +x
          PROJECT_REF="$(tr -d '[:space:]' < supabase/PROJECT_REF)"
          RESULT_FILE="$RUNNER_TEMP/vault-result.json"
          # stdout is only the ::add-mask:: command, which the runner must see;
          # stderr carries status codes and step names, never a body.
          STATUS=0
          node scripts/set-vault-secrets.mjs --ref "$PROJECT_REF" --result "$RESULT_FILE" || STATUS=$?
          if [ -f "$RESULT_FILE" ]; then
            {
              echo "## Vault secrets"
              echo
              echo "Project: \`$PROJECT_REF\`"
              echo
              echo '```json'
              cat "$RESULT_FILE"
              echo '```'
              echo
              echo "Both must be \`true\`. The service role key was never printed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -f "$RESULT_FILE"
          exit "$STATUS"
