name: test
# BILLED MINUTES ARE THE CONSTRAINT. The repository went private on
# 2026-09-17, so every job here is metered, and the free monthly allowance ran
# out on 2026-09-19 - every run since has failed at "the job was not started"
# rather than on a test. One full run of this workflow bills 37 minutes
# (node-tests 28, browser-checks 4, migration-check 3, the two cheap jobs 1
# each; measured on run 35435484944, the last green one before the quota went).
# That number is what the trigger list below is shaped around: nothing here
# makes a job faster, it only stops the same commit being tested three times.
on:
  # ONE RUN PER COMMIT, not three. `push:` with no filter plus `pull_request:`
  # meant every push to a branch with an open PR started BOTH a push run and a
  # pull_request run of all five jobs - 74 billed minutes for one commit, and
  # the two runs test nearly the same tree. The PR run is the one worth
  # keeping: it tests the merge commit, which is what actually lands.
  #
  # So: pull_request everywhere, and push only on main, which is the
  # post-merge check that no earlier run covered (the merge commit a PR run
  # tests is against the base at the time, not against the base as it is when
  # the merge happens).
  push:
    branches: [main]
    # TWIN of the pull_request list below - a path that stops a run on one
    # event and not the other is a filter that does nothing. GitHub Actions
    # does not expand YAML anchors, so the list is written twice; change both,
    # which the guard test asserts.
    # SIX MARKDOWN FILES ARE TEST FIXTURES, not documentation, and the skip
    # has to know the difference. `docs/**` and `**/*.md` would otherwise
    # cover PRIVACY.md and TERMS.md (community-legal-pages,
    # community-backup-sync assert their wording clause by clause), README.md
    # (production-not-demo reads its first line), and
    # docs/community/{achievement-seed,contracts,metrics}.md, which
    # community-achievement-engine and platform-analytics assert the code
    # matches. Skipping those would not lose a test run - it would lose it
    # SILENTLY, and the red would surface on the next unrelated PR. Exactly
    # the failure the migration-immutability rule exists to prevent, in
    # markdown.
    #
    # Hence `paths` with negation rather than `paths-ignore`: GitHub's filter
    # is sequential and a later positive pattern re-includes what an earlier
    # negative one dropped (its own documented example is
    # `*.md`, `!README.md`, `README*`), and `!` is a `paths` feature - the two
    # keys cannot both be used on one event. `**` is everything.
    #
    # test/ci-minutes-budget.test.mjs derives the fixture list from what the
    # suite actually reads, so a seventh fixture fails the build here instead
    # of quietly leaving itself untested.
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "README.md"
      - "PRIVACY.md"
      - "TERMS.md"
      - "docs/community/achievement-seed.md"
      - "docs/community/contracts.md"
      - "docs/community/metrics.md"
  pull_request:
    # Twin of the push list above, which carries the whole argument for it -
    # including why six markdown files are re-included. The two lists must
    # stay identical, and the guard test asserts that.
    #
    # A change that is only documentation runs NOTHING. A change that touches
    # documentation AND code runs everything - a path filter skips a run only
    # when EVERY changed file fails to match.
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "README.md"
      - "PRIVACY.md"
      - "TERMS.md"
      - "docs/community/achievement-seed.md"
      - "docs/community/contracts.md"
      - "docs/community/metrics.md"
permissions:
  contents: read
concurrency:
  # Per branch. `github.head_ref` is the PR's own branch and is empty outside
  # pull_request, where `github.ref` is refs/heads/main - so a PR groups with
  # itself and with nothing else.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # A second push to a branch makes the first run's answer worthless before it
  # finishes, and at 37 minutes a run that nobody will read is the single
  # most expensive thing this workflow can do. This also applies to main:
  # merges there are serial and rare, and the consolidation session's own
  # back-to-back pushes are exactly the case worth cancelling.
  cancel-in-progress: true
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check-version
      - run: npm run check-vendor-version
        # Launch-readiness audit (DEPENDENCY_AUDIT.md): both scripts already
        # existed and both pass today, but neither ran anywhere - a missed
        # APP_VERSION/SW_VERSION bump or vendor/package.json drift on
        # @supabase/supabase-js shipped silently until caught by hand.
      - run: npm audit --audit-level=high
        # Same audit, same finding: 0 vulnerabilities today, but nothing
        # gated a future one. audit-level=high so a low/moderate advisory
        # with no fix available yet does not block every push.

  # Launch-readiness audit, DEP-4. The three Edge Functions import
  # @supabase/supabase-js straight from esm.sh at a pinned version, but had
  # no lockfile - so the exact bytes behind that URL were never verified,
  # and a compromised or re-published module would have been picked up
  # silently on the next deploy. deno.lock records a sha256 per remote
  # module; --frozen fails the build if the resolved graph no longer
  # matches, which is the whole control.
  edge-function-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # PINNED, for the reason the launch-readiness audit already gave
          # about supabase/setup-cli and deploy-edge-functions.yml's own
          # `latest`: a floating version lets a release change this gate's
          # behaviour with no commit in this repo to review. v2.x was the last
          # unpinned version selector left. 2.9.7 is the version the frozen
          # lockfiles were verified against on 2026-09-17.
          deno-version: 2.9.7
      - name: verify each Edge Function against its lockfile
        run: |
          for fn in supabase/functions/*/; do
            [ -f "$fn/index.ts" ] || continue
            echo "--- $fn"
            (cd "$fn" && deno cache --frozen --lock=deno.lock index.ts)
          done

  # Every function in supabase/functions/ must exist on the live project.
  # Added after two of three sat undeployed for weeks: the nightly cron job
  # POSTed to a 404 and still recorded 'succeeded', and admin_reset_password
  # answered 404 to real admins in the browser. Uses only the PUBLISHABLE key
  # already shipped in cloud-config.js - 401 means deployed, 404 means not -
  # so it is safe on a fork and needs no secret.
  #
  # A HARD GATE. This repo does not allow a CI job to opt out of failing the
  # build, pinned by community-rls-boundaries.test.mjs - which caught the
  # first draft of this job doing exactly that, and then caught the second
  # draft naming the escape hatch in a comment, since the assertion matches
  # the whole file rather than the job keys. Both catches were correct.
  #
  # No escape hatch is needed anyway: the script separates "not deployed"
  # from "could not ask", and only the former fails. An unreachable project,
  # a network error or a 5xx exits 0 with the reason printed, so a Supabase
  # outage cannot turn every branch red.
  edge-functions-deployed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node scripts/check-edge-functions-deployed.mjs

  browser-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: scripts/browser-check
      - run: npx playwright install --with-deps chromium
        working-directory: scripts/browser-check
      - run: node run-all.mjs
        working-directory: scripts/browser-check
  migration-check:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so check-migration-immutability.mjs can resolve a real
      # merge base; the default shallow clone has no history to compare to
      # and the check would skip itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          # Launch-readiness audit, INFRASTRUCTURE_AUDIT.md. Was `latest` -
          # the one unpinned component in an otherwise fully SHA-pinned
          # workflow, sitting on the job that gates every schema change. A
          # CLI release could change migration behaviour underneath this
          # gate with no commit in this repo. Pinned to the version the
          # audit actually verified the full suite against (79 files, 2747
          # pgTAP assertions, PASS).
          version: 2.116.0
      # Migrations are immutable once applied - Supabase tracks them by
      # filename, so an edit to an already-applied file diverges local from
      # production silently. Runs BEFORE the stack starts: it is a cheap
      # git-only check and there is no point booting Postgres to then fail.
      - run: node scripts/check-migration-immutability.mjs
      - run: supabase start
        # Applies every file in supabase/migrations/, in order, against a
        # throwaway local Postgres + Auth + Storage stack. Fails the build
        # on the first migration that doesn't apply cleanly, so a broken
        # migration is caught here instead of against the real project.
      - run: supabase test db
        # Runs the pgTAP suite in supabase/tests/ against that same stack.
        # Each NNNN_slug_test.sql impersonates two auth users in one
        # transaction and asserts RLS allow or deny for real, per the
        # boundary list in docs/community/backlog.md. This is coverage the
        # static assertions in test/community-rls-boundaries.test.mjs cannot
        # give, since the JS mock has no policy engine. pgTAP ships in the
        # Supabase images.
