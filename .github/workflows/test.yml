name: test
# MINUTES. This repository went private on 2026-09-17 and burned through the
# free Actions allowance on 2026-09-19. One full run of this workflow bills 37
# minutes (28 node-tests + 4 browser-checks + 3 migration-check + 1 + 1,
# measured on run 35435484944), so what triggers it matters as much as what it
# does.
on:
  # ONE RUN PER PUSH, NOT TWO. An unqualified `push:` fired on every branch, so
  # a push to a PR branch started a push run AND a pull_request run - two full
  # 37-minute runs of the identical tree, in two different concurrency groups,
  # so neither even cancelled the other. Pushes are now main-only; a PR branch
  # is covered by the pull_request trigger, and the post-merge run on main is
  # unchanged.
  push:
    branches: [main]
    # DOCUMENTATION-ONLY CHANGES DO NOT NEED 37 MINUTES OF RUNNERS.
    #
    # This list is deliberately NOT "docs/** and **/*.md". Six markdown
    # files are read and asserted on by the suite, and three of them live
    # under docs/:
    #
    #   PRIVACY.md                          community-backup-sync,
    #                                       community-legal-pages
    #   TERMS.md                            community-legal-pages
    #   README.md                           production-not-demo
    #   docs/community/achievement-seed.md  community-achievement-engine
    #   docs/community/contracts.md         community-achievement-engine
    #   docs/community/metrics.md           platform-analytics
    #
    # Ignoring those would let an edit that contradicts the code merge with
    # the test that guards it never running. So this enumerates only the
    # paths nothing reads, and every omission fails in the SAFE direction: a
    # doc that is not listed simply costs a run. test/workflow-minutes.test.mjs
    # derives the read set from test/*.mjs itself and fails if any of it ever
    # falls inside this list, so the two cannot drift.
    #
    # docs/community/ is outside the list except for tickets/, because three
    # of the seven files directly in it are on that read list.
    #
    # GitHub Actions does not support YAML anchors, so this list is repeated
    # verbatim under pull_request. The same test asserts the two copies parse
    # to the same set, which is the only thing that keeps them honest.
    paths-ignore:
      - 'docs/audit/**'
      - 'docs/deploy/**'
      - 'docs/handover/**'
      - 'docs/ops/**'
      - 'docs/visual-qa/**'
      - 'docs/community/tickets/**'
      - 'docs/DESIGN_HANDOFF.md'
      - 'docs/PROJECT_STATUS.md'
      - 'CHANGES.md'
      - 'CLAUDE.md'
      - 'CLAUDE_CODE_PROMPT.md'
      - 'COMMUNITY_SETUP.md'
      - 'README1.md'
      - '2026-*.md'
  pull_request:
    # The same list as the push trigger above, repeated because GitHub Actions
    # has no YAML anchors. Read the reasoning there; do not edit one copy
    # alone - test/workflow-minutes.test.mjs compares them.
    paths-ignore:
      - 'docs/audit/**'
      - 'docs/deploy/**'
      - 'docs/handover/**'
      - 'docs/ops/**'
      - 'docs/visual-qa/**'
      - 'docs/community/tickets/**'
      - 'docs/DESIGN_HANDOFF.md'
      - 'docs/PROJECT_STATUS.md'
      - 'CHANGES.md'
      - 'CLAUDE.md'
      - 'CLAUDE_CODE_PROMPT.md'
      - 'COMMUNITY_SETUP.md'
      - 'README1.md'
      - '2026-*.md'
permissions:
  contents: read
concurrency:
  # PER BRANCH, so a second push cancels the first branch's run mid-flight.
  # head_ref is the source branch on a pull_request event; github.ref there is
  # refs/pull/N/merge, which is per-PR rather than per-branch and does not
  # group with anything else. Falls back to github.ref for the push-to-main
  # run, where head_ref is empty.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check-version
      - run: npm run check-vendor-version
        # Launch-readiness audit (DEPENDENCY_AUDIT.md): both scripts already
        # existed and both pass today, but neither ran anywhere - a missed
        # APP_VERSION/SW_VERSION bump or vendor/package.json drift on
        # @supabase/supabase-js shipped silently until caught by hand.
      - run: npm audit --audit-level=high
        # Same audit, same finding: 0 vulnerabilities today, but nothing
        # gated a future one. audit-level=high so a low/moderate advisory
        # with no fix available yet does not block every push.

  # Launch-readiness audit, DEP-4. The three Edge Functions import
  # @supabase/supabase-js straight from esm.sh at a pinned version, but had
  # no lockfile - so the exact bytes behind that URL were never verified,
  # and a compromised or re-published module would have been picked up
  # silently on the next deploy. deno.lock records a sha256 per remote
  # module; --frozen fails the build if the resolved graph no longer
  # matches, which is the whole control.
  edge-function-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # PINNED, for the reason the launch-readiness audit already gave
          # about supabase/setup-cli and deploy-edge-functions.yml's own
          # `latest`: a floating version lets a release change this gate's
          # behaviour with no commit in this repo to review. v2.x was the last
          # unpinned version selector left. 2.9.7 is the version the frozen
          # lockfiles were verified against on 2026-09-17.
          deno-version: 2.9.7
      - name: verify each Edge Function against its lockfile
        run: |
          for fn in supabase/functions/*/; do
            [ -f "$fn/index.ts" ] || continue
            echo "--- $fn"
            (cd "$fn" && deno cache --frozen --lock=deno.lock index.ts)
          done

  # Every function in supabase/functions/ must exist on the live project.
  # Added after two of three sat undeployed for weeks: the nightly cron job
  # POSTed to a 404 and still recorded 'succeeded', and admin_reset_password
  # answered 404 to real admins in the browser. Uses only the PUBLISHABLE key
  # already shipped in cloud-config.js - 401 means deployed, 404 means not -
  # so it is safe on a fork and needs no secret.
  #
  # A HARD GATE. This repo does not allow a CI job to opt out of failing the
  # build, pinned by community-rls-boundaries.test.mjs - which caught the
  # first draft of this job doing exactly that, and then caught the second
  # draft naming the escape hatch in a comment, since the assertion matches
  # the whole file rather than the job keys. Both catches were correct.
  #
  # No escape hatch is needed anyway: the script separates "not deployed"
  # from "could not ask", and only the former fails. An unreachable project,
  # a network error or a 5xx exits 0 with the reason printed, so a Supabase
  # outage cannot turn every branch red.
  edge-functions-deployed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/check-edge-functions-deployed.mjs

  browser-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: scripts/browser-check
      - run: npx playwright install --with-deps chromium
        working-directory: scripts/browser-check
      - run: node run-all.mjs
        working-directory: scripts/browser-check
  migration-check:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so check-migration-immutability.mjs can resolve a real
      # merge base; the default shallow clone has no history to compare to
      # and the check would skip itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          # Launch-readiness audit, INFRASTRUCTURE_AUDIT.md. Was `latest` -
          # the one unpinned component in an otherwise fully SHA-pinned
          # workflow, sitting on the job that gates every schema change. A
          # CLI release could change migration behaviour underneath this
          # gate with no commit in this repo. Pinned to the version the
          # audit actually verified the full suite against (79 files, 2747
          # pgTAP assertions, PASS).
          version: 2.116.0
      # Migrations are immutable once applied - Supabase tracks them by
      # filename, so an edit to an already-applied file diverges local from
      # production silently. Runs BEFORE the stack starts: it is a cheap
      # git-only check and there is no point booting Postgres to then fail.
      - run: node scripts/check-migration-immutability.mjs
      # Two files sharing a version. Supabase records an applied migration
      # by version alone, so a collision means one of them can never be
      # applied - loudly on a local reset, SILENTLY against a real project,
      # where db push simply skips it. Needs no git history, so unlike the
      # check above it cannot skip itself on a shallow clone.
      - run: node scripts/check-migration-versions.mjs
      - run: supabase start
        # Applies every file in supabase/migrations/, in order, against a
        # throwaway local Postgres + Auth + Storage stack. Fails the build
        # on the first migration that doesn't apply cleanly, so a broken
        # migration is caught here instead of against the real project.
      - run: supabase test db
        # Runs the pgTAP suite in supabase/tests/ against that same stack.
        # Each NNNN_slug_test.sql impersonates two auth users in one
        # transaction and asserts RLS allow or deny for real, per the
        # boundary list in docs/community/backlog.md. This is coverage the
        # static assertions in test/community-rls-boundaries.test.mjs cannot
        # give, since the JS mock has no policy engine. pgTAP ships in the
        # Supabase images.
