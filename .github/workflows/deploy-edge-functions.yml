name: deploy-edge-functions
# WHY THIS EXISTS.
#
# Until 2026-09-08 this repo had no automated deploy for Edge Functions at
# all. Migrations have a documented path (`supabase db push`, ordered before
# the client merge), and the client ships to Pages on every push to main.
# Functions had nothing - they were deployed by hand, from someone's laptop,
# whenever somebody remembered.
#
# The result was not one forgotten deploy. It was TWO OF THREE functions
# missing from production for weeks, undetected:
#
#   * purge_abandoned_profiles - the nightly 03:31 UTC cron job POSTed to it
#     and got 404 every night. cron.job_run_details recorded 'succeeded',
#     because the SQL that fires the request succeeds whether or not the
#     request finds anything at the other end, so scheduled_job_health()
#     reported the job healthy the whole time.
#   * admin_reset_password - called from the BROWSER by a real admin session
#     (cloud.js, threat model entry point E8). A live, user-facing 404 that
#     no monitor could ever have caught, because the job health check only
#     knows about cron jobs and this one is not a cron job.
#
# A deploy step that a human has to remember is not a deploy step. This
# workflow makes "what is deployed" a function of what is on main.
#
# ---------------------------------------------------------------------------
# REQUIRED SECRET, added in Settings -> Secrets and variables -> Actions:
#
#   SUPABASE_ACCESS_TOKEN - a personal access token from
#     https://supabase.com/dashboard/account/tokens
#
# It is NOT the service_role key and must never be confused with it: this
# token deploys code, the service_role key reads and writes member data.
# Neither belongs in this repository. Until the secret is set, this workflow
# fails loudly rather than reporting a green deploy that did nothing - which
# is the exact failure mode it was written to end.
# ---------------------------------------------------------------------------
# 2026-09-17: this workflow was workflow_dispatch ONLY, which contradicts every
# word of the header above it. Nothing triggered it on a merge, so "what is
# deployed is a function of what is on main" was true only if a human
# remembered to press the button - the exact habit the file was written to
# replace. Caught when notif_push_send sat undeployed after its merge and the
# gateway kept answering 404.
#
# The choice list was also stale: it named three of the four functions that
# existed, so a targeted dispatch could not deploy sanitize_upload at all and
# 'all' was the only working option for it. A list of names in a workflow is
# the same maintenance burden as a list of names in a test, and it drifted the
# same way. Both are fixed; the list now carries every function, and adding one
# means adding it here too.
on:
  push:
    branches: [main]
    paths:
      # The shared modules count: _shared/webPush.mjs IS the encryption, and a
      # change there that never deploys is a change that did not happen.
      - "supabase/functions/**"
      - ".github/workflows/deploy-edge-functions.yml"
  workflow_dispatch:
    inputs:
      function:
        description: "Which function to deploy (or 'all')"
        required: true
        default: all
        type: choice
        options: [all, purge_abandoned_profiles, notif_push_send]
permissions:
  contents: read
concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: jajmlyrjlkhclgphbfbb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: refuse to run without the access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set. Nothing was deployed."
            echo "This step fails on purpose: a deploy workflow that skips"
            echo "quietly is indistinguishable from one that worked, and that"
            echo "confusion is why two functions sat undeployed for weeks."
            exit 1
          fi

      # Security hunt round 9: this was the one unpinned action left in the
      # repo (test.yml's migration-check job had the identical `@v1` /
      # `version: latest` pattern fixed by an earlier launch-readiness
      # audit, but that fix never reached this file) - and it is the
      # higher-privilege of the two, running with a real
      # SUPABASE_ACCESS_TOKEN against production Edge Functions rather than
      # a throwaway local stack. A floating tag and `latest` mean a CLI
      # release could change deploy behaviour under this job with no commit
      # in this repo to review. Same SHA/version test.yml already pinned to.
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0

      # Verified against the lockfile FIRST, by the same command the
      # edge-function-lockfiles job in test.yml runs. A function that cannot
      # resolve its own pinned dependencies must never reach production, and
      # finding that out here costs a minute instead of an incident.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # PINNED, for the reason the launch-readiness audit already gave
          # about supabase/setup-cli and deploy-edge-functions.yml's own
          # `latest`: a floating version lets a release change this gate's
          # behaviour with no commit in this repo to review. v2.x was the last
          # unpinned version selector left. 2.9.7 is the version the frozen
          # lockfiles were verified against on 2026-09-17.
          deno-version: 2.9.7
      - name: verify each function against its lockfile
        run: |
          for fn in supabase/functions/*/; do
            [ -f "$fn/index.ts" ] || continue
            echo "--- $fn"
            (cd "$fn" && deno cache --frozen --lock=deno.lock index.ts)
          done

      - name: deploy
        run: |
          set -euo pipefail
          # A push event carries no inputs.function. Without this the else
          # branch below would run `supabase functions deploy "" ` and deploy
          # nothing while the job stayed green - the same shape as every other
          # false-green this repo has found. A merge deploys everything;
          # only an explicit dispatch narrows it.
          FN="${{ inputs.function }}"
          [ -n "$FN" ] || FN=all
          if [ "$FN" = "all" ]; then
            for fn in supabase/functions/*/; do
              [ -f "$fn/index.ts" ] || continue
              name="$(basename "$fn")"
              echo "::group::deploy $name"
              supabase functions deploy "$name" --project-ref "$PROJECT_REF"
              echo "::endgroup::"
            done
          else
            supabase functions deploy "$FN" --project-ref "$PROJECT_REF"
          fi

      # Deploying is not the same as being deployed. This reads the project
      # back and fails if any function in the repo is missing from it - the
      # check that, had it existed, would have caught both absences.
      - name: verify every repo function is now live on the project
        run: |
          set -euo pipefail
          # --output json IS LOAD-BEARING. Without it the CLI prints a human
          # ASCII table here, and the grep below - written against JSON -
          # matches nothing, so every function reports MISSING whether it
          # deployed or not. That is exactly what happened on the first run
          # with a working token (2026-09-17): five MISSING lines for five
          # functions that were live.
          #
          # The trap is that the author of that grep never saw the table. The
          # CLI detects when it is being driven by an agent and switches to
          # JSON on its own, so the format depends on WHO RUNS IT - and a
          # local check against real output can agree with the code while CI
          # gets something else entirely.
          supabase functions list --project-ref "$PROJECT_REF" --output json > /tmp/live.json
          # A check that cannot read its input must say so, not report MISSING
          # as though it had looked. Runs BEFORE the loop so the misleading
          # per-function output never appears at all.
          head -c 1 /tmp/live.json | grep -q '[[{]' || {
            echo "functions list did not return JSON - this step cannot verify anything."
            echo "It returned:"; head -n 5 /tmp/live.json
            exit 1
          }
          missing=0
          for fn in supabase/functions/*/; do
            [ -f "$fn/index.ts" ] || continue
            name="$(basename "$fn")"
            # Whitespace-tolerant: --output json pretty-prints as
            # `"slug": "name"`, the agent form emits `"slug":"name"`.
            if grep -Eq "\"slug\"[[:space:]]*:[[:space:]]*\"$name\"" /tmp/live.json; then
              echo "  OK       $name"
            else
              echo "  MISSING  $name"
              missing=1
            fi
          done
          exit $missing
