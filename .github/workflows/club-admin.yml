name: club-admin
# The owner's Haimunia club actions (docs/club/research.md, section C;
# docs/ops/CLUB_OWNERSHIP.md). Each runs one granted-to-no-role function through
# the Supabase Management API's SQL endpoint, with the SUPABASE_ACCESS_TOKEN the
# other workflows already use.
#
#   create_club   creates the one club, with `who` as its owner and first member
#   set_coach     makes `who` (already a club member) the coach
#   set_owner     makes `who` (already a club member) the owner
#   usage_report  prints the usage totals (devices per week and per app; no ids)
#
# THE REPOSITORY IS PUBLIC, SO THIS LOG IS PUBLIC. The username is masked before
# anything else runs and is hashed before it reaches SQL; the log shows a
# one-word status, or totals only.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        required: true
        type: choice
        options: [create_club, set_coach, set_owner, usage_report]
      who:
        description: "Username (not needed for usage_report)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: club-admin
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ACTION: ${{ inputs.action }}
      WHO: ${{ inputs.who }}
    steps:
      - name: mask the username
        run: |
          set +x
          if [ -n "$WHO" ]; then echo "::add-mask::$WHO"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: refuse to run without the access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set. Nothing was changed."
            exit 1
          fi
      - name: run the action
        run: |
          set +x
          node scripts/club-admin.mjs
