name: claude-review
# An automated review when a pull request is OPENED, plus an @claude mention
# handler for the PR conversation, using anthropics/claude-code-action. A later
# push does not produce a review on its own - ask for one.
#
# WHAT THIS IS NOT. It is not a gate. Every hard rule in CLAUDE.md already has
# a deterministic guard that fails the build in test.yml - migration
# immutability, sw.js precache membership, action pinning, the public surface,
# the RLS boundary assertions. This workflow reviews the things a regex cannot
# see: whether the twin of a changed rule was also changed, whether a new CSS
# rule themes itself, whether a new column is one nobody should be storing. It
# comments; it never blocks. Treat a finding as a second reader's opinion, and
# keep adding real guards for anything that turns out to be a repeat.
#
# Required repository secret (Settings -> Secrets and variables -> Actions):
#   CLAUDE_CODE_OAUTH_TOKEN  - from `claude setup-token`, or from
#                              `/install-github-app` in the Claude Code CLI.
#
# Until that secret exists this workflow SKIPS with a notice instead of going
# red. That is the opposite of scheduled-job-alert.yml, which fails closed on a
# missing secret, and the difference is deliberate: that workflow's own failure
# IS its alert, while a red X on every PR from an advisory reviewer that has
# not been set up yet is just noise nobody would read.
on:
  # OPENED ONLY, NOT synchronize. A review on every push cost a runner per push
  # and mostly re-read a diff it had already reviewed - and this repository ran
  # out of free Actions minutes on 2026-09-19. The first push of a PR still
  # gets a full unprompted review; after that, ask for one. A push no longer
  # produces one on its own, which also means the reviewer can no longer
  # contradict itself across pushes without being asked.
  #
  # `reopened` is deliberately absent too: reopening a PR reviews a diff that
  # was already reviewed when it was opened.
  pull_request:
    types: [opened]
  # The two kinds of PR comment. issue_comment fires for the conversation tab;
  # pull_request_review_comment fires for a comment pinned to a line of the
  # diff. A review SUBMISSION body (pull_request_review) is deliberately not
  # here - mentioning @claude while approving is more often a note to a human
  # than a request to the bot. Add it if that turns out to be wrong.
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
# NOTE ON `contents: read`. Least privilege, so this reviewer cannot push. A
# mention can therefore answer, read the tree and comment, but cannot commit a
# fix - ask it what to change, not to change it. Widening this to
# `contents: write` would give a token that can write to the repository to
# whatever a PR comment says, which is a much larger decision than it looks.
concurrency:
  # Per PR, not per branch: a second push while a review is still running makes
  # the first review stale - it describes a diff that no longer exists.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    # Everything that can be decided from the event payload alone is decided
    # here, so a comment that is not an @claude mention on a PR never starts a
    # runner. Two of the three events carry the head repo, so a fork-based PR
    # is rejected before anything runs; issue_comment does not, and is handled
    # by the first step below.
    if: >-
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) || (
        github.event_name == 'pull_request_review_comment' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.comment.body, '@claude')
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '@claude')
      )
    steps:
      # Checked before the fork lookup below, because a repository with no
      # token set should cost one step and no API calls.
      - name: is CLAUDE_CODE_OAUTH_TOKEN set?
        id: auth
        env:
          # Only tested for emptiness. Never echoed, never written to an
          # output, never passed to anything but the action itself.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Claude review skipped::CLAUDE_CODE_OAUTH_TOKEN is not set. Add it under Settings -> Secrets and variables -> Actions to turn the review on. Skipping, not failing."
          fi

      # issue_comment's payload says only "this issue is a PR" - it carries no
      # head repo at all, so the fork check the job-level `if` makes for the
      # other two events has to be one API read here.
      - name: is this PR from a fork?
        id: source
        if: github.event_name == 'issue_comment' && steps.auth.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          head_repo="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.repo.full_name // ""')"
          if [ "$head_repo" = "$REPO" ]; then
            echo "fork=false" >> "$GITHUB_OUTPUT"
          else
            echo "fork=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Claude review skipped::PR #$PR_NUMBER is from ${head_repo:-a fork that no longer exists}, not $REPO."
          fi

      # Pinned to the same SHA test.yml already uses, so there is one checkout
      # version in this repository rather than two.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.auth.outputs.present == 'true' && steps.source.outputs.fork != 'true'
        with:
          # Shallow on purpose. The one check that genuinely needs history - the
          # merge-base comparison in check-migration-immutability.mjs - already
          # runs in test.yml's migration-check job with fetch-depth: 0. What
          # this review needs from git is the tree (to grep for the twins of a
          # changed rule), and `gh pr diff --name-status` tells it which files
          # were modified rather than added, which is the migration signal.
          fetch-depth: 1

      # THE AUTOMATIC REVIEW. Carries a prompt, so the action runs it as
      # automation against the PR's diff.
      # The fork guard is a no-op on this path - the job-level `if` already
      # rejected a fork-based `pull_request` - but it is spelled out anyway, so
      # the two action steps read as twins rather than as one that forgot.
      - name: review the pull request
        if: github.event_name == 'pull_request' && steps.auth.outputs.present == 'true' && steps.source.outputs.fork != 'true'
        # anthropics/claude-code-action v1 (= v1.0.230), pinned to the commit
        # the tag resolved to, per test/workflow-action-pinning.test.mjs: `@v1`
        # is a moving tag, and a moving tag on a job holding a token is exactly
        # what that test exists to prevent. To take a newer version, re-resolve
        # the tag (`git ls-remote https://github.com/anthropics/claude-code-action refs/tags/v1^{}`)
        # and update both the SHA and the version in this comment.
        uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33 # v1.0.261
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Read CLAUDE.md at the repository root first. It is the rules file
            for this project, and every check below is one of its rules. The PR
            branch is already checked out in the working directory.

            Review this pull request for these seven things, in this order. Go
            through all seven on every PR, even a one-line one.

            1. SUPABASE SECURITY SURFACE. Any change to an RLS policy, to a
               SECURITY DEFINER function, or to a grant to the `anon` or
               `authenticated` role. For each one, say in one line who could
               read or write what before, and who can after. A SECURITY DEFINER
               function without a pinned `search_path` is a finding on its own.

            2. EDITS TO APPLIED MIGRATIONS. `gh pr diff --name-status` marks a
               file under supabase/migrations/ as M rather than A. Supabase
               tracks migrations by filename, so an edit to one that has
               already run is invisible - a local reset replays the edited file
               and passes while production still carries what the original did.
               Corrections go in a NEW migration, always.

            3. SIBLING DRIFT - the characteristic defect of this codebase, and
               the check worth the most of your time. A rule changed in one
               place and not in its twins: the same predicate in a policy and
               again in the client, the same algorithm in two files, a cap
               applied at one call site of three. Do not grep for the symptom.
               Take the rule that changed, grep for the pattern, and list every
               other place it lives. Say which twins were changed with it and
               which were not.

            4. CSS AND THE THEME BLOCKS. This app declares its theme three
               times: `:root{...}` for light,
               `@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){...} }`
               for the OS default, and `:root[data-theme="dark"]{...}` for an
               explicit choice. A new rule that sets a colour in only one of
               the last two renders one theme's text on the other theme's
               background. A rule built from the existing tokens (--surface,
               --border, --steel, --chalk, --brass) themes itself and needs no
               duplicate - prefer that, and say so.

            5. NEW FILES AND THE sw.js PRECACHE LIST. A file added to
               index.html and not to sw.js breaks the app offline with no
               signal. Core files app.js cannot run without belong in
               REQUIRED_ASSETS; anything the app degrades gracefully without
               (cloud.js and its src/* dependencies, fonts, icons) belongs in
               OPTIONAL_ASSETS.

            6. SECRETS IN CLIENT FILES. The repository root IS the website -
               every committed file is served. The publishable Supabase key and
               the VAPID public key belong in cloud-config.js. A service-role
               key, a database password or a VAPID private key must not appear
               in this repository at all. functions/_middleware.js is
               disclosure control, not a secret store, and git history is
               history: if you find one, say that rotating it is the fix and
               deleting the line is not.

            7. MEMBER HEALTH, PAYMENT, PHONE OR EMAIL DATA. There is no such
               column in the schema and there must not be one. Sign-in maps a
               username to a synthetic <name>@members.haimuniya.invalid address
               precisely so no real address exists to leak. A new column, form
               field, payload key or log line carrying any of these is a
               finding, whatever it is called.

            Then read the diff once more for ordinary correctness bugs, and
            report anything real that these seven did not cover.

            HOW TO REPORT. Be specific and be short. Each finding gets the file
            and line, what breaks, and the smallest fix. Order them worst
            first. If a check found nothing, say so in a few words rather than
            explaining what you looked at. Do not restate the diff, do not
            praise the PR, and do not invent work: "nothing found in seven of
            seven" is a complete and welcome review.

            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for a finding that sits on a specific line, and
            `gh pr comment` for the summary. Post GitHub comments only - review
            text returned as a message is never seen by anyone.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

      # AN @claude MENTION. No prompt, so the action answers the comment that
      # triggered it rather than re-running the checklist above. It reads and
      # comments; `contents: read` means it cannot push a fix.
      - name: answer an @claude mention
        if: github.event_name != 'pull_request' && steps.auth.outputs.present == 'true' && steps.source.outputs.fork != 'true'
        # Same pin, same reason - see the version comment on the step above.
        # These two SHAs are twins: bump them together.
        uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33 # v1.0.261
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
